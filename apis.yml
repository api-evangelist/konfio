aid: konfio
name: Konfio
description: >-
  Konfio is a leading Mexican fintech serving small and medium businesses
  (SMBs) with an all-in-one platform: working-capital and term loans
  (Konfio Creditos), a business credit card (Konfio Tarjeta), payment
  terminals and acceptance (Konfio Pagos / Sirvis), and SMB management
  tools. Underwriting is powered by a proprietary algorithm that combines
  alternative data and ML to score creditworthiness in minutes. Konfio's
  product surface is overwhelmingly direct-to-SMB and the company does not
  publish a self-service public developer portal. Partner integrations
  (e.g. PayPal Working Capital, Goldman Sachs / Gramercy capital
  facilities, marketplace lending) are negotiated bilaterally.
